name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 关键步骤：把内嵌的中转站服务端交叉编译成 Android arm64 静态二进制。
      #
      # 为什么改名 .so：Android 10+ 对 app 私有目录实施 W^X，普通文件无法 exec；
      # 只有 nativeLibraryDir（/data/app/<pkg>/lib/arm64/）允许执行。配合
      # build.gradle 的 useLegacyPackaging=true 与 manifest 的
      # extractNativeLibs=true，安装时会把二进制解压成磁盘上的真实文件。
      #
      # CGO_ENABLED=0 产出纯静态二进制，无 libc 依赖，可直接在 Android 上运行。
      - name: Cross-compile embedded relay (Android arm64)
        run: |
          set -e
          cd go-src
          # jniLibs 目录只存 CI 生成的产物，不被 git 跟踪，而 go build -o 不建父目录
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          echo "==> go version: $(go version)"
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" \
            -o ../app/src/main/jniLibs/arm64-v8a/libtrae2api.so \
            ./cmd/server
          echo "==> 产物"
          ls -la ../app/src/main/jniLibs/arm64-v8a/
          file ../app/src/main/jniLibs/arm64-v8a/libtrae2api.so || true
          SIZE=$(stat -c%s ../app/src/main/jniLibs/arm64-v8a/libtrae2api.so 2>/dev/null || echo 0)
          echo "relay binary size: ${SIZE} bytes"
          if [ "${SIZE}" -lt 1000000 ]; then
            echo "::error::二进制过小（${SIZE} B），疑似编译失败"
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK，这里只需准备 Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # runner 上的 aapt2 偶尔缺失（AGP 会去 maven 拉，网络抖动就失败，
      # 报 "Specified AAPT2 executable does not exist: /opt/aapt2-shim/aapt2"）。
      # 显式预取到 Gradle 缓存，避免这一步成为构建的不稳定因素。
      - name: Pre-fetch Android build tools
        run: |
          for i in 1 2 3; do
            if gradle :app:help --no-daemon -q >/dev/null 2>&1; then
              echo "Gradle 预热成功"; break
            fi
            echo "第 $i 次预热失败，重试…"
            sleep 5
          done
          echo "AAPT2 缓存位置："
          find ~/.gradle/caches -name 'aapt2*' -maxdepth 8 2>/dev/null | head -5 || true

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-未设置}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>/dev/null | head

      - name: Build APK
        run: |
          set +e
          for i in 1 2 3; do
            echo "═══ 构建尝试 $i ═══"
            log="build-$i.log"
            gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            if [ "$code" -eq 0 ]; then
              echo "构建成功"
              exit 0
            fi
            echo "尝试 $i 失败（退出码 $code）"
            if grep -q "AAPT2 executable does not exist" "$log" 2>/dev/null; then
              echo "检测到 AAPT2 缺失，清理相关缓存后重试"
              rm -rf "$HOME"/.gradle/caches/transforms-* 2>/dev/null || true
              find "$HOME"/.gradle/caches -path '*aapt2*' -maxdepth 8 -exec rm -rf {} + 2>/dev/null || true
            fi
            sleep 8
          done
          echo "::error::三次构建均失败"
          echo "=== 环境诊断 ==="
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" 2>/dev/null | tail -3
          find / -name 'aapt2' -type f 2>/dev/null | head -3
          exit 1

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -type f | while read -r f; do
            echo "found: $f"
          done
          cp app/build/outputs/apk/release/app-release.apk out/TraeWeb.apk
          ls -la out/

      # 确认内嵌的中转站二进制真的进了 APK —— 少了它中转站功能会静默失效
      - name: Verify embedded relay
        run: |
          set -e
          APK=out/TraeWeb.apk
          echo "==> APK 内 native 库"
          unzip -l "$APK" | grep -E "lib/|\.dex" || true
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/libtrae2api.so"; then
            echo "✓ 中转站二进制已打包进 APK"
          else
            echo "::error::APK 内没有 lib/arm64-v8a/libtrae2api.so，中转站功能会失效"
            exit 1
          fi
          SIZE=$(unzip -l "$APK" | grep "libtrae2api.so" | awk '{print $1}')
          echo "  二进制大小: ${SIZE} bytes"
          MANIFEST_OK=$(unzip -p "$APK" AndroidManifest.xml | strings | grep -c extractNativeLibs || true)
          echo "  manifest extractNativeLibs 命中: ${MANIFEST_OK}"

      # 注意：AGP 8.x 默认只写 APK Signature Scheme v2/v3（存放在 ZIP 的签名块里），
      # 不再生成 META-INF/*.RSA，所以不能用 unzip -l 判断签名。
      - name: Verify APK signature
        run: |
          APK=out/TraeWeb.apk
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner 2>/dev/null | sort -rV | head -1 || true)
          if [ -n "$APKSIGNER" ]; then
            echo "使用 $APKSIGNER"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            echo "✓ 签名校验通过"
          else
            echo "apksigner 不可用，退化为签名块检测"
            if grep -qa "APK Sig Block 42" "$APK" \
               || unzip -l "$APK" | grep -qE 'META-INF/.*\.(RSA|DSA|EC|SF)'; then
              echo "✓ 检测到签名"
            else
              echo "✗ 未检测到签名"; exit 1
            fi
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraeWeb-APK
          path: out/TraeWeb.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/TraeWeb.apk
          generate_release_notes: true

      - name: Summary
        run: |
          SIZE=$(du -h out/TraeWeb.apk | cut -f1)
          {
            echo "### APK 构建完成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 文件 | \`TraeWeb.apk\` |"
            echo "| 大小 | ${SIZE} |"
            echo "| 提交 | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
