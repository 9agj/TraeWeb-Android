name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK，这里只需准备 Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-未设置}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>/dev/null | head

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -type f | while read -r f; do
            echo "found: $f"
          done
          cp app/build/outputs/apk/debug/app-debug.apk out/TraeWeb.apk
          ls -la out/
          # 校验签名（未签名的 APK 无法安装）
          if unzip -l out/TraeWeb.apk | grep -qE 'META-INF/.*\.(RSA|DSA|EC|SF)'; then
            echo "✓ APK 已签名"
          else
            echo "✗ APK 未签名"; exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraeWeb-APK
          path: out/TraeWeb.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/TraeWeb.apk
          generate_release_notes: true

      - name: Summary
        run: |
          SIZE=$(du -h out/TraeWeb.apk | cut -f1)
          {
            echo "### APK 构建完成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 文件 | \`TraeWeb.apk\` |"
            echo "| 大小 | ${SIZE} |"
            echo "| 提交 | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
