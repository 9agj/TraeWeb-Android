<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>接入服务 · 控制台</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --border:#30363d;
  --fg:#e6edf3; --dim:#8b949e; --accent:#2f81f7; --accent-dim:#1f6feb;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149; --purple:#a371f7;
  --r:6px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
a{color:var(--accent);text-decoration:none}

/* ── 顶栏 ── */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;background:var(--panel);
  border-bottom:1px solid var(--border);
  padding-top:calc(11px + env(safe-area-inset-top));
}
.topbar .mark{
  width:26px;height:26px;flex:none;border-radius:var(--r);
  background:linear-gradient(135deg,#2f81f7,#a371f7);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;color:#fff;
}
.topbar .title{font-weight:600;font-size:14.5px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .title small{color:var(--dim);font-weight:400;font-size:12px;margin-left:7px}

/* ── 布局：侧栏 + 内容 ── */
.shell{display:flex;min-height:calc(100vh - 49px)}
.side{
  width:186px;flex:none;background:var(--panel);
  border-right:1px solid var(--border);
  padding:12px 8px;
  position:sticky;top:49px;height:calc(100vh - 49px);overflow-y:auto;
}
.side .group{color:var(--dim);font-size:11px;font-weight:600;
  padding:10px 10px 5px;letter-spacing:.4px;text-transform:uppercase}
.side .item{
  display:flex;align-items:center;gap:9px;
  padding:7px 10px;border-radius:var(--r);cursor:pointer;
  color:var(--fg);font-size:13px;margin-bottom:2px;
}
.side .item:hover{background:var(--panel2)}
.side .item.active{background:var(--accent-dim);color:#fff;font-weight:500}
.side .item .ic{width:15px;text-align:center;flex:none;opacity:.9}
.side .item .cnt{
  margin-left:auto;font-size:11px;color:var(--dim);
  background:rgba(255,255,255,.07);padding:1px 6px;border-radius:9px;
}
.side .item.active .cnt{color:#fff;background:rgba(255,255,255,.2)}

.main{flex:1;min-width:0;padding:18px 16px 60px}
.main h2{margin:0 0 4px;font-size:17px;font-weight:600}
.main .sub{color:var(--dim);font-size:12.5px;margin-bottom:16px}

/* ── 卡片 ── */
.card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:var(--r);padding:14px;margin-bottom:12px;
}
.card.err{border-color:rgba(248,81,73,.4)}
.card h3{margin:0 0 10px;font-size:14px;font-weight:600}

/* ── 账号条目（GitHub 列表风） ── */
.acct{
  display:flex;align-items:center;gap:12px;
  padding:12px;border-bottom:1px solid var(--border);
}
.acct:last-child{border-bottom:none}
.acct .av{
  width:34px;height:34px;flex:none;border-radius:50%;
  background:var(--panel2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-weight:600;color:var(--dim);font-size:14px;
}
.acct .info{flex:1;min-width:0}
.acct .nm{font-weight:600;font-size:13.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .meta{color:var(--dim);font-size:11.5px;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .cred{text-align:right;flex:none;min-width:70px}
.acct .cred .n{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.acct .cred .l{color:var(--dim);font-size:10.5px}
.acct .acts{display:flex;gap:5px;flex:none}

/* ── 按钮 ── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:5px 11px;border-radius:var(--r);cursor:pointer;
  font-size:12.5px;font-weight:500;font-family:inherit;
  border:1px solid var(--border);background:var(--panel2);color:var(--fg);
}
.btn:hover{border-color:#8b949e}
.btn.pri{background:var(--ok);border-color:rgba(63,185,80,.4);color:#04260f;font-weight:600}
.btn.pri:hover{background:#4ac95e}
.btn.dan{color:var(--bad)}
.btn.dan:hover{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:3px 8px;font-size:11.5px}

/* ── 徽标 ── */
.badge{
  display:inline-flex;align-items:center;
  padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:500;
  border:1px solid transparent;margin-left:5px;vertical-align:middle;
}
.badge.ok{color:var(--ok);background:rgba(63,185,80,.12);border-color:rgba(63,185,80,.3)}
.badge.warn{color:var(--warn);background:rgba(210,153,34,.12);border-color:rgba(210,153,34,.3)}
.badge.bad{color:var(--bad);background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.3)}
.badge.mut{color:var(--dim);background:rgba(139,148,158,.12);border-color:rgba(139,148,158,.25)}

/* ── 表单 ── */
.field{margin-bottom:11px}
.field label{display:block;font-size:12.5px;font-weight:500;margin-bottom:5px}
.field .hint{color:var(--dim);font-size:11.5px;font-weight:400;margin-left:6px}
input[type=text],input[type=password],textarea,select{
  width:100%;padding:7px 10px;border-radius:var(--r);
  background:var(--bg);border:1px solid var(--border);color:var(--fg);
  font-size:13px;font-family:inherit;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(47,129,247,.15)}
textarea{min-height:76px;resize:vertical;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  background:var(--bg);border:1px solid var(--border);border-radius:5px;
  padding:1px 5px;word-break:break-all;
}
.keyline{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:9px 11px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);
}
.keyline code{background:none;border:none;padding:0;flex:1;min-width:0;user-select:all}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ── 提示条 ── */
.note{
  padding:9px 11px;border-radius:var(--r);font-size:12.5px;line-height:1.6;
  background:rgba(47,129,247,.08);border:1px solid rgba(47,129,247,.25);
  color:#a5c9f5;margin-bottom:14px;
}
.note.warn{background:rgba(210,153,34,.08);border-color:rgba(210,153,34,.25);color:#e3b341}
.note.bad{background:rgba(248,81,73,.08);border-color:rgba(248,81,73,.25);color:#ff9492}
.empty{color:var(--dim);text-align:center;padding:36px 16px;font-size:13px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── 用量表 ── */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--border)}
th{color:var(--dim);font-weight:500;font-size:11px}
td.num{text-align:right;font-variant-numeric:tabular-nums}

/* ── 统计块 ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px}
.stat .k{color:var(--dim);font-size:11px;margin-bottom:4px}
.stat .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}

/* ── 弹层 ── */
.mask{position:fixed;inset:0;background:rgba(1,4,9,.75);z-index:50;
  display:none;align-items:center;justify-content:center;padding:20px}
.mask.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:8px;
  max-width:460px;width:100%;max-height:82vh;overflow:auto;padding:16px}

/* 窄屏：侧栏收到顶部横向滚动 */
@media (max-width:560px){
  .shell{flex-direction:column}
  .side{width:100%;height:auto;position:static;display:flex;gap:4px;
    overflow-x:auto;padding:8px;border-right:none;border-bottom:1px solid var(--border)}
  .side .group{display:none}
  .side .item{flex:none;white-space:nowrap;padding:6px 11px;margin:0}
  .side .item .cnt{display:none}
  .main{padding:14px 12px 60px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="mark">T</div>
  <div class="title">接入服务 <small id="hdrSub">OpenAI 兼容</small></div>
  <button class="btn sm" onclick="refreshActive()">刷新</button>
</div>

<div class="shell">
  <nav class="side">
    <div class="group">总览</div>
    <div class="item active" data-view="overview" onclick="go('overview',this)">
      <span class="ic">◈</span>概览</div>
    <div class="group">账号</div>
    <div class="item" data-view="accounts" onclick="go('accounts',this)">
      <span class="ic">◉</span>账号管理<span class="cnt" id="cntAcct">0</span></div>
    <div class="item" data-view="balance" onclick="go('balance',this)">
      <span class="ic">◐</span>Token 余额</div>
    <div class="item" data-view="credits" onclick="go('credits',this)">
      <span class="ic">◎</span>额度监控</div>
    <div class="group">设置</div>
    <div class="item" data-view="key" onclick="go('key',this)">
      <span class="ic">⚿</span>访问密钥</div>
    <div class="item" data-view="usage" onclick="go('usage',this)">
      <span class="ic">▤</span>接入说明</div>
  </nav>

  <main class="main" id="main">
    <div class="empty"><span class="spin"></span>加载中…</div>
  </main>
</div>

<div class="mask" id="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ═══════════════════════ 基础 ═══════════════════════ */

let VIEW = 'overview';
let ACCOUNTS = [];
let CREDITS = [];
let SUMMARY = null;
let FETCHED_AT = '';
// 服务端会把当前 Key 注入为 window.__TW2A_KEY__（见 admin.go 的 adminPage）。
// 本地缓存作为回退，优先用服务端注入的权威值。
let KEY = (typeof window.__TW2A_KEY__ === 'string' && window.__TW2A_KEY__)
  || localStorage.getItem('tw2a_key') || '';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/,
  (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => (n == null || n < 0) ? '—' : Number(n).toLocaleString('en-US');

function authHeader() {
  return KEY ? { 'Authorization': 'Bearer ' + KEY } : {};
}

async function api(path, opts) {
  const o = Object.assign({ cache: 'no-store' }, opts || {});
  o.headers = Object.assign({}, authHeader(), o.headers || {});
  const r = await fetch(path, o);
  const txt = await r.text();
  let j = null;
  try { j = JSON.parse(txt); } catch (e) { /* 保留原文 */ }
  if (!r.ok) {
    const msg = (j && j.error && (j.error.message || j.error.code)) || txt.slice(0, 160);
    throw new Error('HTTP ' + r.status + ' · ' + msg);
  }
  return j;
}

function toast(msg, kind) {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:99;'
    + 'padding:9px 16px;border-radius:6px;font-size:13px;max-width:86%;text-align:center;'
    + 'background:' + (kind === 'bad' ? 'var(--bad)' : kind === 'warn' ? 'var(--warn)' : 'var(--ok)')
    + ';color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.4)';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function badge(text, kind) {
  return '<span class="badge ' + (kind || 'mut') + '">' + esc(text) + '</span>';
}

/* ═══════════════════════ 路由 ═══════════════════════ */

function go(view, el) {
  VIEW = view;
  document.querySelectorAll('.side .item').forEach((n) => n.classList.remove('active'));
  if (el) el.classList.add('active');
  else {
    const t = document.querySelector('.side .item[data-view="' + view + '"]');
    if (t) t.classList.add('active');
  }
  render();
}

function refreshActive() {
  if (VIEW === 'accounts') { loadAccounts(); }
  else if (VIEW === 'credits' || VIEW === 'balance') { loadCredits(); }
  else { render(); }
  toast('已刷新');
}

/* ═══════════════════════ 数据 ═══════════════════════ */

async function loadAccounts() {
  try {
    const d = await api('/admin/api/accounts');
    ACCOUNTS = (d && d.accounts) || [];
    $('cntAcct').textContent = ACCOUNTS.length;
    if (VIEW === 'accounts' || VIEW === 'overview') render();
  } catch (e) {
    if (VIEW === 'accounts' || VIEW === 'overview') {
      $('main').innerHTML = errBlock('读取账号失败', e.message);
    }
  }
}

async function loadCredits() {
  try {
    const d = await api('/admin/api/credits');
    CREDITS = (d && (d.accounts || d.items)) || [];
    SUMMARY = (d && d.summary) || null;
    FETCHED_AT = (d && d.fetched_at) || '';
    if (VIEW === 'accounts' || VIEW === 'overview' || VIEW === 'balance') render();
  } catch (e) {
    $('main').innerHTML = errBlock('读取额度失败', e.message);
  }
}

function errBlock(title, msg) {
  return '<h2>' + esc(title) + '</h2><div class="sub"></div>'
    + '<div class="note bad">' + esc(msg || '未知错误') + '</div>'
    + '<div class="row"><button class="btn" onclick="render()">重试</button></div>';
}

/* ═══════════════════════ 视图 ═══════════════════════ */

function render() {
  const m = $('main');
  if (VIEW === 'overview') return viewOverview(m);
  if (VIEW === 'accounts') return viewAccounts(m);
  if (VIEW === 'balance') return viewBalance(m);
  if (VIEW === 'credits') return viewCredits(m);
  if (VIEW === 'key') return viewKey(m);
  if (VIEW === 'usage') return viewUsage(m);
}

/* ── 概览 ── */
function viewOverview(m) {
  const total = ACCOUNTS.length;
  const enabled = ACCOUNTS.filter((a) => a.enabled !== false).length;
  const soon = ACCOUNTS.filter((a) => a.expiredSoon).length;
  const cooling = ACCOUNTS.filter((a) => a.cooling).length;
  const creditSum = CREDITS.reduce((s, c) => s + (Number(c.remain) || 0), 0);

  m.innerHTML =
    '<h2>概览</h2><div class="sub">接入服务运行在本机 127.0.0.1:7864</div>'
    + '<div class="stats">'
    +   stat('账号总数', total)
    +   stat('已启用', enabled)
    +   stat('Token 余额', SUMMARY ? fmt(SUMMARY.remain) : (CREDITS.length ? fmt(creditSum) : '—'))
    +   stat('即将过期', soon)
    + '</div>'
    + (SUMMARY ? '<div class="card" style="cursor:pointer" onclick="go(\'balance\')">'
        + '<div style="display:flex;align-items:baseline;gap:9px;margin-bottom:9px">'
        +   '<span style="font-size:22px;font-weight:600;color:'
        +   ((SUMMARY.remain_pct||0) > 50 ? 'var(--ok)' : (SUMMARY.remain_pct||0) > 20 ? 'var(--warn)' : 'var(--bad)')
        +   '">' + fmt(SUMMARY.remain) + '</span>'
        +   '<span style="color:var(--dim);font-size:12.5px">/ ' + fmt(SUMMARY.limit) + ' 积分</span>'
        +   '<span style="margin-left:auto;color:var(--dim);font-size:11.5px">查看明细 ›</span>'
        + '</div>'
        + '<div style="height:7px;background:var(--bg);border:1px solid var(--border);border-radius:4px;overflow:hidden">'
        +   '<div style="height:100%;width:' + (SUMMARY.remain_pct||0).toFixed(1) + '%;background:'
        +   ((SUMMARY.remain_pct||0) > 50 ? 'var(--ok)' : (SUMMARY.remain_pct||0) > 20 ? 'var(--warn)' : 'var(--bad)')
        +   '"></div></div>'
        + '</div>' : '')
    + (soon > 0 ? '<div class="note warn">有 ' + soon + ' 个账号的凭证将在 24 小时内过期，'
        + '点击左侧「账号管理」可刷新。</div>' : '')
    + (cooling > 0 ? '<div class="note warn">' + cooling + ' 个账号处于冷却中（上游限流）。</div>' : '')
    + '<div class="card"><h3>快捷操作</h3><div class="row">'
    +   '<button class="btn pri" onclick="loadCredits()">刷新余额</button>'
    +   '<button class="btn" onclick="go(\'accounts\')">账号管理</button>'
    +   '<button class="btn" onclick="go(\'key\')">查看访问密钥</button>'
    + '</div></div>'
    + '<div class="card"><h3>账号摘要</h3>'
    + (total === 0
        ? '<div class="empty">还没有账号。<br>请在 App 里点「添加账号」完成登录，凭证会自动同步到这里。</div>'
        : acctList(ACCOUNTS, true))
    + '</div>';

  if (CREDITS.length === 0 && total > 0) loadCredits();
}

function stat(k, v) {
  return '<div class="stat"><div class="k">' + esc(k) + '</div><div class="v">' + esc(String(v)) + '</div></div>';
}

/* ── 账号管理 ── */
function viewAccounts(m) {
  m.innerHTML =
    '<h2>账号管理</h2>'
    + '<div class="sub">共 ' + ACCOUNTS.length + ' 个账号 · 点「登录」刷新即将过期的凭证</div>'
    + (ACCOUNTS.length === 0
        ? '<div class="card"><div class="empty">还没有账号<br><br>'
          + '请在 App 里点「添加账号」完成登录，凭证会自动同步到这里。</div></div>'
        : '<div class="card" style="padding:0">' + acctList(ACCOUNTS, false) + '</div>');
}

/**
 * 账号列表。compact=true 时隐藏操作按钮（用于概览页）。
 * 布局对齐 GitHub 的列表项：头像 + 主信息 + 右侧数值 + 操作按钮。
 */
function acctList(list, compact) {
  return list.map((a) => {
    const initial = esc((a.nickname || a.uid || '?').trim().charAt(0).toUpperCase() || '?');
    const bs = [];
    // disabled 优先：这是 session 失效导致的硬禁用，账号已完全不可用。
    // 之前只判断 enabled，硬禁用的账号照样显示绿色「启用」，严重误导。
    if (a.disabled) bs.push(badge('已禁用', 'bad'));
    else if (a.enabled === false) bs.push(badge('已停用', 'mut'));
    else bs.push(badge('启用', 'ok'));
    if (a.expiredSoon) bs.push(badge('即将过期', 'warn'));
    if (a.cooling) {
      const l = a.cool_kind === 'soft_rate' ? '限流冷却'
        : a.cool_kind === 'plan_limit' ? '权益不足'
        : a.cool_kind === 'error_threshold' ? '错误冷却' : '冷却中';
      bs.push(badge(l, 'warn'));
    }
    if (a.hasAuth === false) bs.push(badge('缺少凭证', 'bad'));

    const meta = [];
    if (a.uid) meta.push('UID ' + esc(a.uid));
    if (a.machineId) meta.push('机器 ' + esc(a.machineId));
    if (a.deviceId) meta.push('设备 ' + esc(a.deviceId));

    const cred = CREDITS.find((c) => c.uid === a.uid);
    let credit;
    if (cred && !cred.error) {
      credit = '<div class="n">' + fmt(cred.remain) + '</div><div class="l">剩余积分</div>';
    } else if (a.cooling) {
      credit = '<div class="n" style="color:var(--bad)">冷却</div><div class="l">上游限流</div>';
    } else {
      credit = '<div class="n" style="color:var(--dim)">—</div><div class="l">积分未知</div>';
    }

    const errline = a.reason
      ? '<div class="meta" style="color:var(--bad)">' + esc(a.reason) + '</div>' : '';

    return '<div class="acct">'
      + '<div class="av">' + initial + '</div>'
      + '<div class="info">'
      +   '<div class="nm">' + esc(a.nickname || '(未命名)') + bs.join('') + '</div>'
      +   '<div class="meta">' + (meta.join(' · ') || '—') + '</div>'
      +   errline
      + '</div>'
      + '<div class="cred">' + credit + '</div>'
      + (compact ? '' :
          '<div class="acts">'
          + '<button class="btn sm" onclick="refreshAcct(\'' + esc(a.uid) + '\')">刷新</button>'
          + '<button class="btn sm" onclick="toggleAcct(\'' + esc(a.uid) + '\',' + (a.enabled === false) + ')">'
          +   (a.enabled === false ? '启用' : '停用') + '</button>'
          + '<button class="btn sm" onclick="showJSON(\'' + esc(a.uid) + '\')">详情</button>'
          + '<button class="btn sm dan" onclick="deleteAcct(\'' + esc(a.uid) + '\')">删除</button>'
          + '</div>')
      + '</div>';
  }).join('');
}


/* ── Token 余额 ── */
function viewBalance(m) {
  if (CREDITS.length === 0) {
    m.innerHTML = '<h2>Token 余额</h2><div class="sub">实时向上游查询各账号积分</div>'
      + '<div class="card"><div class="empty"><span class="spin"></span>正在查询…</div></div>';
    loadCredits();
    return;
  }

  const sm = SUMMARY || {};
  const pct = Number(sm.remain_pct || 0);
  const barColor = pct > 50 ? 'var(--ok)' : pct > 20 ? 'var(--warn)' : 'var(--bad)';

  // 总览卡片
  let html = '<h2>Token 余额</h2>'
    + '<div class="sub">' + (FETCHED_AT ? '数据时间 ' + esc(FETCHED_AT) : '实时向上游查询')
    + ' · 点「刷新」重新拉取</div>';

  html += '<div class="card">'
    + '<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px">'
    +   '<div style="font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;color:'
    +   barColor + '">' + fmt(sm.remain) + '</div>'
    +   '<div style="color:var(--dim);font-size:13px">/ ' + fmt(sm.limit) + ' 积分可用</div>'
    +   '<div style="margin-left:auto;color:var(--dim);font-size:12px">'
    +     (sm.healthy != null ? (sm.healthy + '/' + sm.total + ' 账号健康') : '') + '</div>'
    + '</div>'
    + '<div style="height:8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;overflow:hidden">'
    +   '<div style="height:100%;width:' + pct.toFixed(1) + '%;background:' + barColor + '"></div>'
    + '</div>'
    + '<div style="display:flex;justify-content:space-between;margin-top:7px;color:var(--dim);font-size:11.5px">'
    +   '<span>已用 ' + fmt(sm.used) + '</span>'
    +   '<span>' + pct.toFixed(1) + '% 剩余</span>'
    + '</div>'
    + '</div>';

  // 明细统计
  html += '<div class="stats">'
    + stat('剩余合计', fmt(sm.remain))
    + stat('已用合计', fmt(sm.used))
    + stat('总量', fmt(sm.limit))
    + stat('今日可领', fmt(sm.checkin_pending))
    + '</div>';

  // 每账号明细
  html += '<div class="card" style="padding:0"><table>'
    + '<thead><tr><th>账号</th><th class="num">剩余</th><th class="num">已用</th>'
    + '<th class="num">总量</th><th>占比</th><th>状态</th></tr></thead><tbody>';

  CREDITS.forEach((c) => {
    const bs = [];
    if (c.error) {
      bs.push(badge('查询失败', 'bad'));
    } else {
      if (c.disabled) bs.push(badge('已禁用', 'bad'));
      else if (!c.enabled) bs.push(badge('已停用', 'mut'));
      else if (c.cooling) {
        // 区分限流冷却与错误冷却，之前统一显示「冷却中」看不出原因
        const label = c.cool_kind === 'soft_rate' ? '限流冷却'
          : c.cool_kind === 'plan_limit' ? '权益不足'
          : c.cool_kind === 'error_threshold' ? '错误冷却' : '冷却中';
        bs.push(badge(label, 'warn'));
      } else {
        bs.push(badge('正常', 'ok'));
      }
      if (c.checkin_enable) bs.push(badge('可领 ' + fmt(c.checkin_credits), 'ok'));
    }

    let row;
    if (c.error) {
      row = '<tr><td>' + esc(c.nickname || c.uid) + '</td>'
        + '<td colspan="5" style="color:var(--bad)">' + esc(c.error) + '</td></tr>';
    } else {
      const p = c.limit > 0 ? (c.remain / c.limit * 100) : 0;
      const col = p > 50 ? 'var(--ok)' : p > 20 ? 'var(--warn)' : 'var(--bad)';
      row = '<tr>'
        + '<td>' + esc(c.nickname || '(未命名)')
        +   '<br><span style="color:var(--dim);font-size:11px">' + esc(c.uid || '') + '</span></td>'
        + '<td class="num" style="color:' + col + ';font-weight:600">' + fmt(c.remain) + '</td>'
        + '<td class="num">' + fmt(c.used) + '</td>'
        + '<td class="num">' + fmt(c.limit) + '</td>'
        + '<td style="min-width:80px">'
        +   '<div style="height:5px;background:var(--bg);border-radius:3px;overflow:hidden">'
        +   '<div style="height:100%;width:' + p.toFixed(1) + '%;background:' + col + '"></div></div>'
        + '</td>'
        + '<td>' + bs.join('') + '</td>'
        + '</tr>';
    }
    html += row;
  });

  html += '</tbody></table></div>'
    + '<div class="row"><button class="btn pri" onclick="loadCredits()">刷新余额</button></div>';

  m.innerHTML = html;
}

/* ═══════════════════════ 操作 ═══════════════════════ */

async function refreshAcct(uid) {
  toast('正在刷新…');
  try {
    await api('/admin/api/accounts/' + encodeURIComponent(uid) + '/refresh', { method: 'POST' });
    toast('已刷新');
    await loadAccounts();
  } catch (e) { toast('刷新失败：' + e.message, 'bad'); }
}

async function toggleAcct(uid, enable) {
  try {
    await api('/admin/api/accounts/' + encodeURIComponent(uid), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: enable })
    });
    toast(enable ? '已启用' : '已停用');
    loadAccounts();
  } catch (e) { toast('操作失败：' + e.message, 'bad'); }
}

async function deleteAcct(uid) {
  if (!confirm('确定删除该账号？\n\n会移除接入服务里的凭证，不影响签到面板。')) return;
  try {
    await api('/admin/api/accounts/' + encodeURIComponent(uid), { method: 'DELETE' });
    toast('已删除');
    loadAccounts();
  } catch (e) { toast('删除失败：' + e.message, 'bad'); }
}

async function showJSON(uid) {
  try {
    const d = await api('/admin/api/accounts/' + encodeURIComponent(uid) + '/json');
    $('modal').innerHTML =
      '<h3 style="margin:0 0 12px;font-size:15px">账号详情</h3>'
      + '<table><tbody>'
      + Object.keys(d).map((k) =>
          '<tr><td style="color:var(--dim)">' + esc(k) + '</td><td><code>'
          + esc(String(d[k])) + '</code></td></tr>').join('')
      + '</tbody></table>'
      + '<div class="row" style="margin-top:14px"><button class="btn" onclick="closeModal()">关闭</button></div>';
    $('mask').classList.add('on');
  } catch (e) { toast('读取失败：' + e.message, 'bad'); }
}

function closeModal() { $('mask').classList.remove('on'); }

/* ── 密钥操作 ── */

function genKey() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  let s = '';
  if (window.crypto && crypto.getRandomValues) {
    const b = new Uint8Array(24);
    crypto.getRandomValues(b);
    // 拒绝采样消除取模偏置
    for (let i = 0; i < b.length; i++) s += chars[b[i] % chars.length];
  } else {
    for (let i = 0; i < 24; i++) s += chars[Math.floor(Math.random() * chars.length)];
  }
  setKey('sk-trae-' + s);
}

function showSetKey() {
  $('modal').innerHTML =
    '<h3 style="margin:0 0 12px;font-size:15px">自定义访问密钥</h3>'
    + '<div class="field"><label>密钥内容'
    + '<span class="hint">8–128 位，字母数字与 _ - . 三种符号</span></label>'
    + '<input type="text" id="newKey" value="' + esc(KEY) + '"></div>'
    + '<div class="row"><button class="btn pri" onclick="setKey($(\'newKey\').value)">保存</button>'
    + '<button class="btn" onclick="closeModal()">取消</button></div>';
  $('mask').classList.add('on');
}

function setKey(v) {
  const k = String(v || '').trim();
  if (!/^[A-Za-z0-9_\-.]{8,128}$/.test(k)) {
    toast('格式不合法：8–128 位，仅限字母数字与 _ - .', 'bad');
    return;
  }
  KEY = k;
  localStorage.setItem('tw2a_key', k);
  closeModal();
  toast('密钥已更新 · 重启接入服务后生效', 'warn');
  render();
}

function copyKey() { copyText(KEY); }

function copyText(t) {
  if (!t) { toast('没有可复制的内容', 'warn'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(
      () => toast('已复制'),
      () => fallbackCopy(t));
  } else fallbackCopy(t);
}

function fallbackCopy(t) {
  const ta = document.createElement('textarea');
  ta.value = t;
  ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('已复制'); }
  catch (e) { toast('复制失败，请长按选择', 'warn'); }
  ta.remove();
}

loadAccounts();
loadCredits();
