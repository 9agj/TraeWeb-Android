org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# arm64 host workaround: the SDK/AGP aapt2 is x86-64 and this machine is arm64.
# Point AGP at a shim that dispatches through qemu-user with an x86-64 sysroot.
android.aapt2FromMavenOverride=/opt/aapt2-shim/aapt2
