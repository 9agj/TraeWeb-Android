org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# ────────────────────────────────────────────────────────────────
# 注意：这里刻意不写 android.aapt2FromMavenOverride。
#
# Android SDK 与 AGP 自带的 aapt2 都是 x86-64 二进制，在 arm64 主机上
# 需要走 qemu-user 转译（本机有 /opt/aapt2-shim/aapt2）。
# 但 CI runner 是 x86-64、没有这个路径 —— 写死会导致 AGP 直接报：
#   Specified AAPT2 executable does not exist: /opt/aapt2-shim/aapt2
#
# 因此改为在 settings.gradle 里按「shim 是否存在」动态设置。
# ────────────────────────────────────────────────────────────────
