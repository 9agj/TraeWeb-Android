plugins {
    id 'com.android.application'
}

android {
    namespace 'com.traeweb.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.traeweb.app"
        // 用 adaptive icon（纯矢量，无 PNG 资源）故最低 API 26；本项目为个人自用，目标机为新版 Android
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName "3.4.1"

        // 内嵌的中转站二进制按 GOARCH=arm64 交叉编译，只出 arm64
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 固定签名：keystore/traeweb.p12 随仓库提交，保证每次构建签名一致，
    // 后续版本可以直接覆盖安装，无需卸载。
    // （个人自用项目，口令公开无妨；若要做正式发布请换成私有 keystore + Secrets）
    signingConfigs {
        fixed {
            storeFile file("../keystore/traeweb.p12")
            storeType "PKCS12"
            storePassword "traeweb123"
            keyAlias "traeweb"
            keyPassword "traeweb123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    /*
     * 内嵌中转站：Go 服务端以 libtrae2api.so 之名放进 jniLibs/arm64-v8a/。
     *
     * Android 10+ 对 app 私有目录实施 W^X，普通文件无法 exec；只有
     * nativeLibraryDir（/data/app/<pkg>/lib/arm64/）允许执行。
     *
     * 而 Android 6+ 默认的 .so 打包方式是「压缩 + 页对齐、安装时 mmap」，
     * 磁盘上不会产生独立文件，也就无法 exec。因此必须：
     *   useLegacyPackaging = true  （打包时压缩，安装时解压）
     *   extractNativeLibs="true"   （manifest 侧配合，见 AndroidManifest.xml）
     */
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 刻意不引入任何第三方依赖：
//   本壳只用系统 API（Activity / WebView / AlertDialog），
//   appcompat 与 webkit 会各自带入不同版本的 kotlin-stdlib，导致
//   checkReleaseDuplicateClasses 失败（Duplicate class ...CollectionsJDK8Kt）。
dependencies {
}
