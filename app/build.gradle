plugins {
    id 'com.android.application'
}

android {
    namespace 'com.traeweb.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.traeweb.app"
        // 用 adaptive icon（纯矢量，无 PNG 资源）故最低 API 26；本项目为个人自用，目标机为新版 Android
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用 debug 签名，便于直接安装（本项目是个人自用壳应用，不发布到商店）
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
