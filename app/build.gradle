plugins {
    id 'com.android.application'
}

android {
    namespace 'com.traeweb.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.traeweb.app"
        // 用 adaptive icon（纯矢量，无 PNG 资源）故最低 API 26；本项目为个人自用，目标机为新版 Android
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        // 统一用 debug 构建：CI 环境没有 debug.keystore 时 assembleRelease 会静默产出
        // 未签名的 APK（装不上）；assembleDebug 由 AGP 自动生成 keystore 并签名，最可靠。
        debug {
            // 不加 applicationIdSuffix，保持与 release 同包名，便于覆盖安装
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 刻意不引入任何第三方依赖：
//   本壳只用系统 API（Activity / WebView / AlertDialog），
//   appcompat 与 webkit 会各自带入不同版本的 kotlin-stdlib，导致
//   checkReleaseDuplicateClasses 失败（Duplicate class ... CollectionsJDK8Kt）。
dependencies {
}
